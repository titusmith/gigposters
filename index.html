<style>
  /* Layout: full-bleed endless masonry field; floating theme switch top right, tag search bottom center */
  :root {
    --bg: #ebebe8;
    --tile: #dcdcd8;
    --fg: #1b1b1a;
    --muted: #6d6d69;
    --chip: rgba(255, 255, 255, 0.72);
    --chip-line: rgba(27, 27, 26, 0.12);
    --knob: #1b1b1a;
    --knob-icon: #ebebe8;
    --panel: rgba(255, 255, 255, 0.9);
    --link: #1b1b1a;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 6px 18px rgba(0, 0, 0, 0.08);
    --lift: 0 2px 6px rgba(0, 0, 0, 0.10), 0 16px 16px rgba(0, 0, 0, .2);
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212; --tile: #1e1e1d; --fg: #ececea; --muted: #9a9a96;
      --chip: rgba(36, 36, 35, 0.72); --chip-line: rgba(236, 236, 234, 0.12);
      --knob: #ececea; --knob-icon: #121212; --panel: rgba(30, 30, 29, 0.9); --link: #ececea;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.3);
      --lift: 0 2px 6px rgba(0, 0, 0, 0.5), 0 24px 60px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212; --tile: #1e1e1d; --fg: #ececea; --muted: #9a9a96;
    --chip: rgba(36, 36, 35, 0.72); --chip-line: rgba(236, 236, 234, 0.12);
    --knob: #ececea; --knob-icon: #121212; --panel: rgba(30, 30, 29, 0.9); --link: #ececea;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 6px 18px rgba(0, 0, 0, 0.3);
    --lift: 0 2px 6px rgba(0, 0, 0, 0.5), 0 24px 60px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--ui);
    overflow: hidden; overscroll-behavior: none;
    transition: background-color .35s ease;
  }
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #stage.dragging { cursor: grabbing; }
  #stage.open { cursor: zoom-out; }

  .card {
    position: absolute; left: 0; top: 0; display: block;
    background: var(--tile);
    border-radius: 2px;
    transform-origin: 50% 50%;
    will-change: transform;
    -webkit-user-drag: none; user-select: none;
    opacity: 0; transition: opacity .3s ease, box-shadow .3s ease;
    cursor: pointer;
  }
  .card.ready { opacity: 1; }
  .card.away, .card.leaving { opacity: 0; pointer-events: none; }
  #stage.reflow .card { transition: opacity .3s ease, transform .45s cubic-bezier(.3,.7,.2,1); }
  #stage.dragging .card, #stage.open .card { cursor: inherit; }
  .card.selected { z-index: 10; box-shadow: var(--lift); }
  .card.prev { z-index: 9; }
  .card.hires { z-index: 11; pointer-events: none; background: transparent; transition: opacity .35s ease; }
  .card.hires.show { opacity: 1; }
  #stage.dim .card.ready:not(.selected) { opacity: .75; }
  @media (hover: hover) {
    #stage:not(.dragging):not(.open) .card.ready:hover { z-index: 5; box-shadow: var(--lift); }
  }

  #empty {
    position: fixed; inset: 0; margin: auto; height: fit-content; width: fit-content;
    color: var(--muted); font-size: 15px; pointer-events: none;
  }

  /* ---- theme switch ---- */
  .theme-switch {
    position: fixed; z-index: 20;
    top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px;
    display: flex; align-items: center;
    width: 64px; height: 34px; padding: 3px;
    border-radius: 999px; border: 1px solid var(--chip-line);
    background: var(--chip); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    cursor: pointer;
  }
  .theme-switch:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .knob {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--knob); color: var(--knob-icon);
    display: grid; place-items: center;
    transition: transform .3s cubic-bezier(.3,.7,.2,1);
  }
  .knob svg { width: 15px; height: 15px; }
  .theme-switch[aria-pressed="true"] .knob { transform: translateX(30px); }
  .icon-moon { display: none; }
  .theme-switch[aria-pressed="true"] .icon-moon { display: block; }
  .theme-switch[aria-pressed="true"] .icon-sun { display: none; }

  /* ---- search ---- */
  .search {
    position: fixed; z-index: 20; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    width: min(400px, calc(100% - 32px));
    display: flex; align-items: center; gap: 10px;
    height: 48px; padding: 0 8px 0 16px;
    border-radius: 999px; border: 1px solid var(--chip-line);
    background: var(--chip); box-shadow: var(--shadow); color: var(--fg);
    -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
    transition: opacity .28s ease, transform .28s cubic-bezier(.3,.7,.2,1);
  }
  .search.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .search.dim  { opacity: .55; transform: translate(-50%, 0); pointer-events: auto; }
  .search > svg { width: 17px; height: 17px; flex: none; color: var(--muted); }
  .search input {
    flex: 1; min-width: 0; height: 100%;
    border: 0; outline: 0; background: transparent; color: var(--fg);
    font: 16px/1 var(--ui);
  }
  .search input::placeholder { color: var(--muted); }
  .clear {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    border: 0; background: transparent; color: var(--muted);
    display: grid; place-items: center; cursor: pointer;
  }
  .clear:hover { color: var(--fg); background: var(--chip-line); }
  .clear:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
  .clear svg { width: 14px; height: 14px; }

  /* ---- paper color swatches ---- */
  .swatches {
    position: fixed; z-index: 20; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    max-width: calc(100% - 32px);
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none;
    transition: opacity .28s ease, transform .28s cubic-bezier(.3,.7,.2,1);
  }
  .swatches.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .swatches.dim  { opacity: .55; transform: translate(-50%, 0); pointer-events: auto; }
  .swatch {
    width: 22px; height: 22px; padding: 0; border-radius: 50%; cursor: pointer;
    background: var(--sw); border: 1px solid rgba(0, 0, 0, 0.18); box-shadow: var(--shadow);
    transition: transform .15s ease, opacity .2s ease, box-shadow .15s ease;
  }
  .swatch:hover:not(:disabled) { transform: scale(1.12); }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg), var(--shadow); }
  .swatch:disabled { opacity: .22; cursor: default; }
  .swatch:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .swatch { position: relative; }
  .sw-x {
    position: absolute; top: -6px; right: -6px; width: 13px; height: 13px;
    display: grid; place-items: center; border-radius: 50%;
    background: var(--fg); color: var(--bg); box-shadow: 0 0 0 1.5px var(--bg);
    opacity: 0; transform: scale(.6); pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  .sw-x svg { width: 8px; height: 8px; }
  .swatch[aria-pressed="true"] .sw-x { opacity: 1; transform: scale(1); }

  /* ---- info ---- */
  .info-btn {
    position: fixed; z-index: 20;
    top: calc(env(safe-area-inset-top, 0px) + 16px); right: 90px;
    width: 34px; height: 34px; padding: 0;
    display: grid; place-items: center;
    border-radius: 50%; border: 1px solid var(--chip-line);
    background: var(--chip); color: var(--fg); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    cursor: pointer;
  }
  .info-btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .info-btn svg { width: 18px; height: 18px; }
  .info-backdrop { position: fixed; inset: 0; z-index: 30; }
  .info {
    position: fixed; z-index: 31; left: 50%; top: 50%;
    min-width: min(600px, calc(100% - 32px)); max-width: calc(100% - 32px);
    min-height: min(300px, calc(100% - 32px)); max-height: calc(100% - 32px);
    overflow: auto; box-sizing: border-box;
    padding: 56px 48px 48px;
    display: flex; flex-direction: column; justify-content: center;
    border-radius: 18px; border: 1px solid var(--chip-line);
    background: var(--panel); color: var(--fg); box-shadow: var(--lift);
    -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3);
    transform: translate(-50%, -50%) scale(.97); opacity: 0;
    transition: opacity .25s ease, transform .3s cubic-bezier(.3,.7,.2,1);
  }
  .info.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .info p { margin: 0; text-align: left; font-size: 17px; line-height: 1.4; max-width: 30em; text-wrap: pretty; }
  .info a { color: var(--link); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; overflow-wrap: anywhere; }
  .info a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 2px; }
  .info .clear { position: absolute; top: 12px; right: 12px; }
  .info .note { margin-top: 20px; font-size: 14px; line-height: 1.4; }
  .info .note a { color: var(--muted); }
  .info .note a:hover { color: var(--fg); }
  @media (max-width: 600px) {
    .info { height: auto; max-height: calc(100% - 32px); padding: 52px 24px 28px; }
  }

  /* ---- phones and tablets: posters and the info button only ---- */
  @media (hover: none) and (pointer: coarse) {
    .search, .swatches, .theme-switch { display: none !important; }
    .info-btn { right: 16px; width: 42px; height: 42px; }
    .info-btn svg { width: 22px; height: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    body, .card, .knob, .search, #stage.reflow .card { transition: none; }
  }
</style>

<script>
(async () => {
  // ---------- data ----------
  // posters.csv lists every design once:  poster, shape, colors, tags
  //   poster: the design name, e.g. 2026-9-25-al (no color, no extension)
  //   shape:  portrait or landscape (blank means portrait); every poster prints at 11x14
  //   colors: printed versions separated by slashes, e.g. pink/cream (blank if only one)
  //   tags:   everything after that, separated by commas
  // Images live in posters/ as  <poster>-<color>.webp  and  <poster>-<color>-thumb.webp
  // (or <poster>.webp and <poster>-thumb.webp when there are no colors).
  // Lines starting with # are notes and are skipped.
  async function loadPosters() {
    const res = await fetch("posters.csv", { cache: "no-cache" });
    if (!res.ok) throw new Error("posters.csv could not be loaded (" + res.status + ")");
    const out = [];
    for (const raw of (await res.text()).split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith("#") || /^poster\s*,/i.test(line)) continue;
      const [name, shape = "", colorCell = "", ...rest] = line.split(",").map(s => s.trim());
      if (!name) continue;
      const landscape = /^l/i.test(shape);
      const colors = colorCell.split("/").map(c => c.trim().toLowerCase()).filter(Boolean);
      const tags = rest.flatMap(t => t.split(";")).map(t => t.trim().toLowerCase()).filter(Boolean);
      const files = colors.length ? colors.map(c => name + "-" + c) : [name];
      const variants = files.map((f, i) => ({ color: colors[i] || "", thumb: "posters/" + f + "-thumb.webp", full: "posters/" + f + ".webp" }));
      out.push({ name, ratio: landscape ? 11 / 14 : 14 / 11, colors, tags, variants });
    }
    return out;
  }
  let POSTERS;
  try { POSTERS = await loadPosters(); }
  catch (err) {
    const msg = document.getElementById("empty");
    msg.textContent = "Couldn’t load the poster list. " + err.message;
    msg.hidden = false;
    return;
  }
  const N = POSTERS.length;
  const OPEN_SCALE = 0.8;      // size of the background posters while one is open
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TOUCH = matchMedia("(hover: none) and (pointer: coarse)").matches;   // phones and tablets

  // seeded randomness so the layout is the same on every load
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const base = [...Array(N).keys()];
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [base[i], base[j]] = [base[j], base[i]]; }

  // ---------- layout ----------
  // Every column is endless and independent. Going down a column, the shown posters come in
  // runs ("cycles") that each hold every poster once, in a fresh shuffle per column and per
  // cycle. Each cycle has the same total height, so the field never leaves gaps, and the
  // shuffles are seeded from the column/cycle number so the canvas stays put as you move.
  let active = [...base];      // posters currently shown (all, or the search matches)
  let L = N;
  let colW, gap, vgap, stride, period, slotW;
  const cycleCache = new Map();
  const hash = (a, b) => {
    let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ 0x9e3779b9;
    h = Math.imul(h ^ (h >>> 15), 2246822519);
    h = Math.imul(h ^ (h >>> 13), 3266489917);
    return (h ^ (h >>> 16)) >>> 0;
  };
  const rng = s => () => { s = (s + 0x6D2B79F5) >>> 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  function rawShuffle(g, q) {
    const r = rng(hash(g, q)), a = [...active];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  // true print size: portraits are 11 wide, landscapes 14 wide, on the same scale
  const wOf = idx => POSTERS[idx].ratio < 1 ? slotW : colW;
  const hOf = idx => Math.round(wOf(idx) * POSTERS[idx].ratio);
  const toItems = order => { let y = 0; return order.map(idx => { const h = hOf(idx), it = { idx, y, h }; y += h + vgap; return it; }); };

  // Even columns: a free shuffle. Odd columns: filled top to bottom, skipping any poster that would
  // sit level with the same poster in the column to its left or right. Because even columns never
  // touch each other, every pair of neighbors gets checked exactly once, with no chain reaction.
  function cycle(g, q) {
    const key = g + ":" + q;
    let c = cycleCache.get(key);
    if (c) return c;
    c = (mod(g, 2) === 1 && L >= 4) ? oddCycle(g, q) : evenCycle(g, q);
    if (cycleCache.size > 4000) cycleCache.clear();
    cycleCache.set(key, c);
    return c;
  }

  function evenCycle(g, q) {
    const order = rawShuffle(g, q);
    // avoid the same poster twice in a row where one cycle meets the next
    if (L > 1 && order[0] === rawShuffle(g, q - 1)[L - 1]) [order[0], order[1]] = [order[1], order[0]];
    return toItems(order);
  }

  // last poster of an odd column's cycle, fixed in advance so cycles never need each other
  const endPoster = (g, q) => active[hash(g, q * 3 + 1) % L];

  function oddCycle(g, q) {
    const base0 = colOff(g) + q * period;
    const M = gap;                       // extra clearance: same poster can't be this close sideways either
    const spans = [];
    for (const n of [g - 1, g + 1]) {
      const off = colOff(n);
      const qa = Math.floor((base0 - off) / period) - 1;
      for (let qq = qa; qq <= qa + 3; qq++)
        for (const it of cycle(n, qq)) { const a = off + qq * period + it.y; spans.push({ idx: it.idx, a, b: a + it.h }); }
    }
    const clash = (idx, a, h) => {
      let worst = 0;
      for (const s of spans) if (s.idx === idx) {
        const o = Math.min(s.b, a + h + M) - Math.max(s.a, a - M);
        if (o > worst) worst = o;
      }
      return worst;
    };
    const E = endPoster(g, q), Eprev = endPoster(g, q - 1);
    const r = rng(hash(g, q) ^ 0x5bd1e995);
    let best = null, bestScore = Infinity;
    for (let attempt = 0; attempt < 12 && bestScore > 0; attempt++) {
      const pool0 = active.filter(i => i !== E);
      for (let i = pool0.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool0[i], pool0[j]] = [pool0[j], pool0[i]]; }
      const order = []; let y = 0, score = 0;
      while (pool0.length) {
        let pick = -1, pickClash = Infinity;
        for (let i = 0; i < pool0.length; i++) {
          if (order.length === 0 && pool0[i] === Eprev && pool0.length > 1) continue;
          const cl = clash(pool0[i], base0 + y, hOf(pool0[i]));
          if (cl < pickClash) { pick = i; pickClash = cl; if (cl === 0) break; }
        }
        if (pickClash > 0) score++;
        const idx = pool0.splice(pick, 1)[0];
        order.push(idx); y += hOf(idx) + vgap;
      }
      if (clash(E, base0 + y, hOf(E)) > 0) score++;
      order.push(E);
      if (score < bestScore) { bestScore = score; best = order; }
    }
    return toItems(best);
  }
  const colOff = g => Math.round((hash(g, 7919) / 4294967296) * period);
  function layout() {
    const vw = innerWidth;
    colW = vw < 600 ? 104 : vw < 1100 ? 168 : 196;   // phones: about 2.5 posters across
    gap = Math.round(colW * 0.169);
    vgap = gap + 20;                      // space between posters within a column
    slotW = Math.round(colW * 14 / 11);   // column = width of a landscape 14x11 poster
    stride = slotW + gap;
    L = active.length;
    period = active.reduce((sum, idx) => sum + hOf(idx) + vgap, 0);
    cycleCache.clear();
  }

  // ---------- state ----------
  const stage = document.getElementById("stage");
  let pool = new Map();        // key "column:index" -> img element
  let claimable = null;        // old cards that a re-filter may reuse
  let panX = 0, panY = 0;
  let mode = "idle";           // idle | opening | open | closing
  const mod = (a, b) => ((a % b) + b) % b;

  // all cards of column g whose box touches the band [y0, y1], top to bottom
  function colRange(g, y0, y1) {
    const out = [];
    if (!L) return out;
    const top = colOff(g) + panY;
    const q0 = Math.floor((y0 - top) / period) - 1, q1 = Math.floor((y1 - top) / period);
    for (let q = q0; q <= q1; q++) {
      const items = cycle(g, q);
      for (let i = 0; i < L; i++) {
        const it = items[i];
        const y = top + q * period + it.y;
        if (y + it.h < y0 || y > y1) continue;
        const w = wOf(it.idx);
        out.push({ key: g + ":" + (q * L + i), idx: it.idx, x: g * stride + panX + (slotW - w) / 2, y, w, h: it.h });
      }
    }
    return out;
  }

  // Each spot on the canvas shows one color version of its design, picked from the spot's
  // position, so the layout rules (no repeats side by side or stacked) apply to the design
  // and a design with many colors doesn't show up more often than one with a single version.
  function variantFor(idx, key) {
    let vs = POSTERS[idx].variants;
    if (selColor) { const only = vs.filter(v => v.color === selColor); if (only.length) vs = only; }
    const [a, b] = String(key).split(":").map(Number);
    return vs[hash(a * 31 + 17, b) % vs.length];
  }
  function makeCard(idx, key) {
    const v = variantFor(idx, key);
    const img = new Image();
    img.className = "card";
    img.draggable = false;
    img.alt = POSTERS[idx].name + (v.color ? " (" + v.color + ")" : "");
    img.decoding = "async";
    img.dataset.idx = idx;
    img.dataset.full = v.full;
    img.dataset.color = v.color;
    img.onload = () => img.classList.add("ready");
    img.src = v.thumb;
    if (img.complete) {
      if (stage.classList.contains("reflow")) requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add("ready")));
      else img.classList.add("ready");
    }
    stage.appendChild(img);
    return img;
  }

  // reuse a card of the same poster that sat nearby before a re-filter, so it slides into place
  function claim(idx, x, y, key) {
    if (!claimable) return null;
    const want = variantFor(idx, key).color;
    let best = null, bestKey = null, bd = 900;
    for (const [k, el] of claimable) {
      if (+el.dataset.idx !== idx || el.dataset.color !== want) continue;
      const d = Math.hypot(el._x - x, el._y - y);
      if (d < bd) { bd = d; best = el; bestKey = k; }
    }
    if (best) claimable.delete(bestKey);
    return best;
  }

  function ensure(card) {
    let el = pool.get(card.key);
    if (!el) {
      el = claim(card.idx, card.x, card.y, card.key) || makeCard(card.idx, card.key);
      el.style.width = card.w + "px"; el.style.height = card.h + "px";
      el.dataset.key = card.key;
      pool.set(card.key, el);
      el.style.transform = `translate3d(${card.x}px,${card.y}px,0)`;
    }
    el._x = card.x; el._y = card.y; el._w = card.w; el._h = card.h;
    return el;
  }

  // Draw every card inside the viewport (plus an overscan margin).
  function render() {
    if (mode !== "idle") return;
    const vw = innerWidth, vh = innerHeight, OV = 260;
    const seen = new Set();
    if (L) {
      const g0 = Math.floor((-panX - OV) / stride), g1 = Math.floor((-panX + vw + OV) / stride);
      for (let g = g0; g <= g1; g++) {
        for (const card of colRange(g, -OV, vh + OV)) {
          seen.add(card.key);
          const el = ensure(card);
          el.style.transform = `translate3d(${card.x}px,${card.y}px,0)`;
        }
      }
    }
    for (const [key, el] of pool) if (!seen.has(key)) { if (navLeaving) navLeaving.push(el); else el.remove(); pool.delete(key); }
  }

  // ---------- panning ----------
  let drag = null, vx = 0, vy = 0, glideRaf = 0;
  const DECAY = 0.952;         // per 16ms; about 25% more coasting than before

  stage.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    cancelAnimationFrame(glideRaf);
    drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, lt: performance.now(), moved: false };
    vx = vy = 0;
  });
  addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 5) {
      drag.moved = true;
      if (mode === "idle") { stage.classList.add("dragging"); stage.setPointerCapture?.(drag.id); }
    }
    if (!drag.moved || mode !== "idle") return;   // canvas is locked while a poster is open
    const now = performance.now(), dt = Math.max(1, now - drag.lt);
    vx = vx * 0.6 + (dx / dt) * 0.4; vy = vy * 0.6 + (dy / dt) * 0.4;
    panX += dx; panY += dy;
    drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
    render();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const wasClick = !drag.moved;
    stage.classList.remove("dragging");
    drag = null;
    if (wasClick) return handleClick(e);
    if (mode === "idle" && !reduceMotion) glide();
  }
  addEventListener("pointerup", endDrag);
  addEventListener("pointercancel", e => { if (drag && e.pointerId === drag.id) { drag = null; stage.classList.remove("dragging"); } });

  // momentum after release
  function glide() {
    cancelAnimationFrame(glideRaf);
    let last = performance.now();
    const step = now => {
      const dt = Math.min(40, now - last); last = now;
      if (mode !== "idle") return;
      panX += vx * dt; panY += vy * dt;
      const k = Math.pow(DECAY, dt / 16);
      vx *= k; vy *= k;
      render();
      if (Math.abs(vx) + Math.abs(vy) > 0.02) glideRaf = requestAnimationFrame(step);
    };
    glideRaf = requestAnimationFrame(step);
  }

  // mouse wheel / trackpad: move directly, then coast a little after the scrolling stops
  let wheelT = 0, wheelLast = 0, wvx = 0, wvy = 0;
  stage.addEventListener("wheel", e => {
    e.preventDefault();
    if (mode !== "idle") return;
    cancelAnimationFrame(glideRaf);
    const m = e.deltaMode === 1 ? 16 : 1;
    const dx = -e.deltaX * m, dy = -e.deltaY * m;
    const now = performance.now(), dt = now - wheelLast; wheelLast = now;
    const ivx = dx / Math.max(dt, 16), ivy = dy / Math.max(dt, 16);
    if (dt > 120) { wvx = ivx; wvy = ivy; } else { wvx = wvx * 0.5 + ivx * 0.5; wvy = wvy * 0.5 + ivy * 0.5; }
    panX += dx; panY += dy;
    render();
    clearTimeout(wheelT);
    wheelT = setTimeout(() => {
      if (mode !== "idle" || reduceMotion) return;
      const cap = 2.5;
      vx = Math.max(-cap, Math.min(cap, wvx * 0.6));
      vy = Math.max(-cap, Math.min(cap, wvy * 0.6));
      glide();
    }, 60);
  }, { passive: false });

  // ---------- open / close / arrow keys ----------
  // Every poster's spot on screen is a box: center x/y plus displayed width/height. An animation
  // moves each poster from one box to another. The open poster (and the one handing over to it
  // during an arrow move) is drawn at real size so it stays sharp; the rest are scaled.
  let snap = null, animRaf = 0, progress = 0;
  const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const canvasBox = el => ({ x: el._x + el._w / 2, y: el._y + el._h / 2, w: el._w, h: el._h });

  function draw(el, b, sized) {
    if (sized) {
      el.style.width = b.w + "px"; el.style.height = b.h + "px";
      el.style.transform = `translate3d(${b.x - b.w / 2}px,${b.y - b.h / 2}px,0)`;
    } else {
      el.style.transform = `translate3d(${b.x - el._w / 2}px,${b.y - el._h / 2}px,0) scale(${b.w / el._w})`;
    }
  }

  function handleClick(e) {
    if (mode === "open" || mode === "opening") {
      // on phones, tapping one of the scattered posters hops straight to it (like the arrow keys)
      if (TOUCH && mode === "open") {
        const el = e.target.closest?.(".card:not(.leaving):not(.selected):not(.hires)");
        if (el && snap.items.some(it => it.el === el)) return navigateTo(el);
      }
      return close();
    }
    if (mode !== "idle") return;
    const el = e.target.closest?.(".card:not(.leaving)");
    if (el) open(el);
  }

  function heroBox(sel) {
    const vw = innerWidth, vh = innerHeight, ratio = POSTERS[+sel.dataset.idx].ratio;
    const maxW = vw * 0.88, maxH = vh * 0.84;
    let w = maxW, h = w * ratio;
    if (h > maxH) { h = maxH; w = h / ratio; }
    return { x: vw / 2, y: vh / 2, w, h };
  }

  // While a poster is open, the others scatter outward from it (close neighbors move the most),
  // then a separation pass nudges apart anything that would overlap, so every poster keeps
  // clear space around it and a wider margin around the open poster.
  function scatterLayout(sel) {
    const s = OPEN_SCALE, hb = heroBox(sel);
    const tw = hb.w, th = hb.h, ctx = hb.x, cty = hb.y;
    const c0x = sel._x + sel._w / 2, c0y = sel._y + sel._h / 2;
    const P = gap;               // clear space between small posters
    const H = gap * 1.6;         // clear space around the open poster

    // 1. scatter: radial push away from the selected poster
    const nodes = [];
    for (const el of pool.values()) {
      if (el === sel || el.classList.contains("leaving")) continue;
      const cx = el._x + el._w / 2, cy = el._y + el._h / 2;
      let dx = cx - c0x, dy = cy - c0y, r = Math.hypot(dx, dy);
      if (r < 1) { dx = 0; dy = -1; r = 1; }
      const ux = dx / r, uy = dy / r;
      const edge = (w, h) => Math.min(ux ? (w / 2) / Math.abs(ux) : Infinity, uy ? (h / 2) / Math.abs(uy) : Infinity);
      const b0 = edge(sel._w, sel._h), b1 = edge(tw, th);
      const D = (b1 - b0) + colW * 0.7 + gap * 2;
      const push = D * Math.exp(-Math.max(0, r - b0) / (D * 1.35));
      nodes.push({ el, r: Math.max(0, r - b0),
                   x: ctx + ux * (r + push), y: cty + uy * (r + push),
                   hw: el._w * s / 2 + P / 2, hh: el._h * s / 2 + P / 2 });
    }

    // 2. separate: push overlapping boxes apart along the line between their centers
    const hero = { x: ctx, y: cty, hw: tw / 2 + H - P / 2, hh: th / 2 + H - P / 2 };
    let moved = true;
    const sep = (a, b, fixedA) => {
      let dx = b.x - a.x, dy = b.y - a.y;
      const ox = a.hw + b.hw - Math.abs(dx), oy = a.hh + b.hh - Math.abs(dy);
      if (ox <= 0 || oy <= 0) return;
      let d = Math.hypot(dx, dy);
      if (d < 0.01) { dx = 0; dy = 1; d = 1; }
      const ux = dx / d, uy = dy / d;
      const k = Math.min(ux ? ox / Math.abs(ux) : Infinity, uy ? oy / Math.abs(uy) : Infinity) + 0.5;
      if (fixedA) { b.x += ux * k; b.y += uy * k; }
      else { b.x += ux * k / 2; b.y += uy * k / 2; a.x -= ux * k / 2; a.y -= uy * k / 2; }
      moved = true;
    };
    for (let iter = 0; iter < 160 && moved; iter++) {
      moved = false;
      for (const n of nodes) sep(hero, n, true);
      for (let i = 0; i < nodes.length; i++)
        for (let j = i + 1; j < nodes.length; j++) sep(nodes[i], nodes[j], false);
    }

    const out = new Map();
    for (const n of nodes) out.set(n.el, { box: { x: n.x, y: n.y, w: n.el._w * s, h: n.el._h * s }, r: n.r });
    out.set(sel, { box: hb, r: 0 });
    return out;
  }

  // lay the full-size scan over the thumbnail and fade it in once it's fully decoded,
  // so the poster never flashes blank while the sharper file takes over
  function loadHires(sel) {
    const full = sel.dataset.full;
    if (!full) return;
    const hi = new Image();
    hi.className = "card hires";
    hi.alt = "";
    hi.draggable = false;
    hi.src = full;
    const mine = snap;
    hi.decode().catch(() => {}).then(() => {
      if (snap !== mine || mode === "closing" || !hi.naturalWidth) return;
      snap.hires = hi;
      syncHires(hi, sel);
      stage.appendChild(hi);
      requestAnimationFrame(() => requestAnimationFrame(() => hi.classList.add("show")));
    });
  }

  // keep a full-size overlay exactly on top of its poster
  function syncHires(h, el) {
    const s = el.style;
    h.style.width = s.width; h.style.height = s.height; h.style.transform = s.transform;
  }

  function open(sel) {
    cancelAnimationFrame(glideRaf);
    const items = [];
    for (const [el, { box, r }] of scatterLayout(sel))
      items.push({ el, from: canvasBox(el), to: box, sized: el === sel, delay: el === sel ? 0 : Math.min(110, r * 0.12) });
    snap = { items, sel };
    sel.classList.add("selected");
    loadHires(sel);
    stage.classList.add("open", "dim");
    progress = 0;
    animate(1);
  }

  function close() {
    if (!snap || snap.nav) return;     // let an arrow move finish first
    stage.classList.remove("dim");
    if (snap.hires) snap.hires.classList.remove("show");   // fade back to the thumbnail as it shrinks
    animate(0);
  }

  // Arrow keys: hop to the nearest scattered poster in that direction. The canvas glides so the
  // new poster's spot is centered, it grows into the open position while the current one shrinks
  // into the new scatter, all in one move.
  let navLeaving = null;
  function navigate(dx, dy) {
    if (mode !== "open" || !snap) return;
    const vw = innerWidth, vh = innerHeight, cx0 = vw / 2, cy0 = vh / 2;
    let best = null, bestScore = Infinity;
    for (const it of snap.items) {
      if (it.el === snap.sel || it.el.classList.contains("leaving")) continue;
      const ox = it.to.x - cx0, oy = it.to.y - cy0;
      const along = ox * dx + oy * dy, perp = Math.abs(ox * dy - oy * dx);
      if (along <= 0) continue;
      const score = along + perp * 1.5;
      if (score < bestScore) { bestScore = score; best = it.el; }
    }
    if (!best) return;
    navigateTo(best);
  }

  function navigateTo(best) {
    if (mode !== "open" || !snap) return;
    const vw = innerWidth, vh = innerHeight, cx0 = vw / 2, cy0 = vh / 2;
    const now = new Map(snap.items.map(it => [it.el, it.to]));   // where everything sits right now
    const prev = snap.sel, oldHires = snap.hires;
    panX += cx0 - (best._x + best._w / 2);
    panY += cy0 - (best._y + best._h / 2);
    const leaving = [];
    mode = "idle"; navLeaving = leaving; render(); navLeaving = null;

    const items = [];
    for (const [el, { box, r }] of scatterLayout(best)) {
      const from = now.get(el);
      if (!from) {   // posters that weren't on screen fade in at their new spot
        el.classList.remove("ready");
        requestAnimationFrame(() => requestAnimationFrame(() => { if (el.complete) el.classList.add("ready"); }));
      }
      items.push({ el, from: from || box, to: box, sized: el === best || el === prev, delay: from && el !== best && el !== prev ? Math.min(90, r * 0.08) : 0 });
    }
    for (const el of leaving) { el.classList.add("leaving"); setTimeout(() => el.remove(), 400); }

    prev.classList.remove("selected"); prev.classList.add("prev");
    best.classList.add("selected");
    if (oldHires) oldHires.classList.remove("show");
    snap = { items, sel: best, prev, oldHires, nav: true };
    loadHires(best);
    progress = 0;
    animate(1);
  }

  // after an arrow move, make this layout the one that closing returns from
  function settle() {
    if (snap.oldHires) snap.oldHires.remove();
    if (snap.prev) snap.prev.classList.remove("prev");
    for (const it of snap.items) {
      if (it.sized && it.el !== snap.sel) {
        it.el.style.width = it.el._w + "px"; it.el.style.height = it.el._h + "px";
        it.sized = false;
        draw(it.el, it.to, false);
      }
      it.from = canvasBox(it.el);
    }
    snap.nav = false; snap.prev = null; snap.oldHires = null;
  }

  function apply(p) {
    for (const it of snap.items) {
      // nearer posters start first; farther ones follow a beat later (a small ripple)
      const df = it.delay / 700;
      const t = ease(Math.min(1, Math.max(0, (p - df) / (1 - df))));
      const a = it.from, b = it.to;
      draw(it.el, { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, w: a.w + (b.w - a.w) * t, h: a.h + (b.h - a.h) * t }, it.sized);
    }
    if (snap.hires) syncHires(snap.hires, snap.sel);
    if (snap.oldHires && snap.prev) syncHires(snap.oldHires, snap.prev);
  }

  function finishClose() {
    if (snap.hires) snap.hires.remove();
    if (snap.oldHires) snap.oldHires.remove();
    const sel = snap.sel;
    sel.classList.remove("selected");
    if (snap.prev) snap.prev.classList.remove("prev");
    for (const el of pool.values()) { el.style.width = el._w + "px"; el.style.height = el._h + "px"; }
    snap = null; mode = "idle"; progress = 0;
    stage.classList.remove("open", "dim");
    render();
  }

  function closeNow() {
    if (!snap) return;
    cancelAnimationFrame(animRaf);
    finishClose();
  }

  function animate(target) {
    cancelAnimationFrame(animRaf);
    mode = target ? "opening" : "closing";
    const dur = reduceMotion ? 1 : (snap.nav ? 680 : target ? 720 : 620);
    const start = progress, t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      progress = start + (target - start) * k;
      apply(progress);
      if (k < 1) { animRaf = requestAnimationFrame(step); return; }
      if (target) { mode = "open"; if (snap.nav) settle(); }
      else finishClose();
    };
    animRaf = requestAnimationFrame(step);
  }

  const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  addEventListener("keydown", e => {
    if (e.key === "Escape" && snap) return close();
    if (e.key === "Escape" && (input.value || selColor)) return clearSearch();
    if (snap && ARROWS[e.key] && e.target !== input) { e.preventDefault(); navigate(...ARROWS[e.key]); }
  });

  addEventListener("resize", () => {
    closeNow();
    for (const el of pool.values()) el.remove();
    pool.clear();
    layout(); render();
  });

  // ---------- search ----------
  const searchEl = document.getElementById("search");
  const input = document.getElementById("q");
  const clearBtn = document.getElementById("clear");
  const emptyEl = document.getElementById("empty");
  const swatchesEl = document.getElementById("swatches");
  const noHover = matchMedia("(hover: none)").matches;
  let near = false, reflowT = 0;

  // Paper colors: the swatch shade for each color name used in posters.csv.
  // A name that isn't listed here still works; it's drawn with the browser's color of that name.
  const PAPER = { green: "#6cae6e", blue: "#4a74c9", red: "#d6453a", yellow: "#f3d64a",
                  pink: "#e58fb5", white: "#f2ead5", black: "#1f1f1e" };
  let selColor = "";
  const swatchBtns = new Map();
  {
    const order = Object.keys(PAPER), rank = c => (order.indexOf(c) + 1) || 99;
    const all = [...new Set(POSTERS.flatMap(p => p.colors))].sort((a, b) => rank(a) - rank(b));
    for (const c of all) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "swatch"; b.title = c;
      b.style.setProperty("--sw", PAPER[c] || c);
      b.setAttribute("aria-label", c + " paper");
      b.setAttribute("aria-pressed", "false");
      b.innerHTML = '<span class="sw-x" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></span>';
      b.addEventListener("click", () => { selColor = selColor === c ? "" : c; refilter(); updateSearchUI(); });
      swatchesEl.appendChild(b); swatchBtns.set(c, b);
    }
    swatchesEl.hidden = !all.length;
  }

  let lastKey = base.join() + "|";
  function refilter() {
    const raw = input.value.trim(), q = raw.toLowerCase();
    const tagMatch = q ? base.filter(i => POSTERS[i].tags.some(t => t.includes(q))) : [...base];
    // only colors the tag matches come in are shown (the selected one stays so it can be turned off)
    const avail = new Set(tagMatch.flatMap(i => POSTERS[i].colors));
    for (const [c, b] of swatchBtns) {
      b.hidden = !avail.has(c) && c !== selColor;
      b.setAttribute("aria-pressed", String(c === selColor));
      b.title = c === selColor ? "Clear " + c : c;
    }
    // nothing to choose between when the results come in one color (a selected color stays so it can be cleared)
    swatchesEl.hidden = !selColor && [...avail].filter(c => swatchBtns.has(c)).length < 2;
    const next = selColor ? tagMatch.filter(i => POSTERS[i].colors.includes(selColor)) : tagMatch;
    emptyEl.hidden = next.length > 0;
    emptyEl.textContent = next.length ? "" :
      selColor ? (raw ? `No ${selColor} posters tagged “${raw}”` : `No ${selColor} posters`) : `No posters tagged “${raw}”`;
    const key = next.join() + "|" + selColor;
    if (key === lastKey) return;
    lastKey = key;
    closeNow();
    cancelAnimationFrame(glideRaf);
    active = next;
    claimable = pool; pool = new Map();
    stage.classList.add("reflow");
    layout(); render();           // panX / panY are untouched, so you stay where you are
    for (const el of claimable.values()) { el.classList.add("leaving"); setTimeout(() => el.remove(), 350); }
    claimable = null;
    clearTimeout(reflowT);
    reflowT = setTimeout(() => stage.classList.remove("reflow"), 520);
  }

  function updateSearchUI() {
    const focused = searchEl.contains(document.activeElement) || swatchesEl.contains(document.activeElement);
    const hasFilter = input.value.length > 0 || !!selColor;
    clearBtn.hidden = !hasFilter;
    for (const el of [searchEl, swatchesEl]) {
      el.classList.toggle("show", focused || near);
      el.classList.toggle("dim", !(focused || near) && (hasFilter || noHover));
    }
  }

  addEventListener("mousemove", e => {
    const dist = el => {
      const r = el.getBoundingClientRect();
      return Math.hypot(Math.max(r.left - e.clientX, 0, e.clientX - r.right), Math.max(r.top - e.clientY, 0, e.clientY - r.bottom));
    };
    const n = dist(searchEl) <= 20 || (!swatchesEl.hidden && dist(swatchesEl) <= 20);
    if (n !== near) { near = n; releaseIfIdle(); updateSearchUI(); }
  });
  document.documentElement.addEventListener("mouseleave", () => { near = false; releaseIfIdle(); updateSearchUI(); });

  // an empty bar with the cursor away from it lets go of focus, so it can fade out
  function releaseIfIdle() {
    if (!near && !input.value && document.activeElement === input) input.blur();
    if (!near && swatchesEl.contains(document.activeElement)) document.activeElement.blur();
  }
  input.addEventListener("input", () => { refilter(); releaseIfIdle(); updateSearchUI(); });

  // typing anywhere on the canvas starts a search
  addEventListener("keydown", e => {
    if (TOUCH || e.target === input || e.metaKey || e.ctrlKey || e.altKey || e.isComposing || infoOpen) return;
    if (e.target instanceof HTMLButtonElement && (e.key === " " || e.key === "Enter")) return;
    if (e.key.length !== 1 || (e.key === " " && !input.value)) return;
    e.preventDefault();
    input.value += e.key;
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    refilter(); updateSearchUI();
  });
  input.addEventListener("focus", updateSearchUI);
  input.addEventListener("blur", () => setTimeout(updateSearchUI, 0));
  const clearSearch = () => { input.value = ""; selColor = ""; refilter(); input.focus(); releaseIfIdle(); updateSearchUI(); };
  clearBtn.addEventListener("click", clearSearch);
  swatchesEl.addEventListener("focusout", () => setTimeout(updateSearchUI, 0));
  input.addEventListener("keydown", e => {
    if (e.key === "Escape" && (input.value || selColor)) { e.preventDefault(); e.stopPropagation(); clearSearch(); }
  });

  // ---------- theme switch ----------
  const sw = document.getElementById("themeSwitch");
  const root = document.documentElement;
  const sysDark = matchMedia("(prefers-color-scheme: dark)");
  let saved = null;
  try { saved = localStorage.getItem("poster-canvas-theme"); } catch (_) {}
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : sysDark.matches;
  const syncSwitch = () => {
    const d = isDark();
    sw.setAttribute("aria-pressed", String(d));
    sw.setAttribute("aria-label", d ? "Dark mode on" : "Dark mode off");
  };
  // phones follow the system light/dark setting; the switch is desktop only
  if (!TOUCH && (saved === "dark" || saved === "light")) root.dataset.theme = saved;
  syncSwitch();
  sysDark.addEventListener?.("change", syncSwitch);
  sw.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("poster-canvas-theme", next); } catch (_) {}
    syncSwitch();
  });

  // ---------- info ----------
  const infoBtn = document.getElementById("infoBtn");
  const info = document.getElementById("info");
  const infoBackdrop = document.getElementById("infoBackdrop");
  const infoClose = document.getElementById("infoClose");
  let infoOpen = false, infoT = 0;

  function openInfo() {
    if (infoOpen) return;
    infoOpen = true;
    clearTimeout(infoT);
    cancelAnimationFrame(glideRaf);
    info.hidden = false; infoBackdrop.hidden = false;
    stage.classList.add("dim");
    requestAnimationFrame(() => requestAnimationFrame(() => info.classList.add("show")));
    infoClose.focus({ preventScroll: true });
  }
  function closeInfo() {
    if (!infoOpen) return;
    infoOpen = false;
    info.classList.remove("show");
    infoBackdrop.hidden = true;
    if (!snap) stage.classList.remove("dim");
    infoT = setTimeout(() => { info.hidden = true; }, reduceMotion ? 0 : 300);
    infoBtn.focus({ preventScroll: true });
  }
  infoBtn.addEventListener("click", () => infoOpen ? closeInfo() : openInfo());
  infoClose.addEventListener("click", closeInfo);
  infoBackdrop.addEventListener("pointerdown", e => { e.preventDefault(); closeInfo(); });
  // while the info panel is open, keys belong to it: Esc closes it, Tab stays inside it
  addEventListener("keydown", e => {
    if (!infoOpen) return;
    e.stopImmediatePropagation();
    if (e.key === "Escape") { e.preventDefault(); closeInfo(); }
    else if (e.key === "Tab") {
      const f = [...info.querySelectorAll("button, a[href]")];
      const i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  }, true);

  // ---------- start ----------
  layout();
  panX = -Math.round(stride * 0.4);
  panY = -Math.round(period * 0.15);
  render();
  updateSearchUI();
})();
</script>
